<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Prop Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FB;--card:#fff;--line:#E2E8F2;--ink:#141A2E;--muted:#71809B;
--violet:#4B45E4;--vs:#EEEDFE;--hit:#12B48C;--miss:#E4695C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
.shell{max-width:880px;margin:0 auto;padding:0 20px 80px}
.top{display:flex;align-items:center;gap:10px;padding:22px 0;cursor:pointer}
.orb{width:26px;height:26px;border-radius:50%;border:2px solid var(--violet);position:relative}
.orb::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--violet);top:50%;left:50%;transform:translate(-50%,-50%)}
.top span{font-family:Space Grotesk,sans-serif;font-weight:700;font-size:17px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:14px}
.crumb a{color:var(--violet);cursor:pointer}
h1{font-family:Space Grotesk,sans-serif;font-weight:700;letter-spacing:-.03em;margin:0 0 6px;font-size:clamp(23px,4.4vw,32px)}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;text-align:center;cursor:pointer}
.tile:hover{border-color:#C6CEDD}
.tile.off{opacity:.45;cursor:default}
.disc{width:54px;height:54px;border-radius:50%;background:var(--vs);margin:0 auto 11px;display:flex;align-items:center;justify-content:center;font-size:23px}
.tile b{font-family:Space Grotesk,sans-serif;font-weight:500;font-size:15.5px;display:block}
.tile small{color:var(--muted);font-size:11.5px}
.row{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 18px;margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:14px}
.row:hover{border-color:#C6CEDD}
.row .w{font-family:JetBrains Mono,monospace;font-size:12px;color:var(--muted);width:98px;flex:none}
.row .t{flex:1}
.pill{font-size:11px;padding:4px 10px;border-radius:999px;background:#F1F4F9;color:var(--muted);flex:none}
.pill.on{background:#E2F7F1;color:#0a7a5f}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:11px;cursor:pointer;font-size:14px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
select{width:100%;font-family:Inter,sans-serif;font-size:15px;padding:13px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);cursor:pointer;margin-bottom:18px}
.who{display:flex;align-items:center;gap:15px;margin-bottom:14px}
.big{width:66px;height:66px;border-radius:50%;background:var(--vs);border:2px solid #DAD8FA;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;font-family:Space Grotesk,sans-serif;font-weight:700;font-size:19px;color:#332ea8}
.big img{width:100%;height:100%;object-fit:cover;object-position:top center}
.who b{font-family:Space Grotesk,sans-serif;font-size:19px;font-weight:700;display:block}
.who small{color:var(--muted);font-size:12.5px}
.odbox{background:var(--vs);border-radius:16px;padding:14px 17px;font-size:13.5px;margin-bottom:14px}
.odbox b{font-family:JetBrains Mono,monospace}
.nood{background:#F7F9FD;border-radius:16px;padding:12px 17px;font-size:13px;color:var(--muted);margin-bottom:14px}
.stats{display:flex;gap:10px;padding:15px 2px;border-top:1px solid #EEF2F8;border-bottom:1px solid #EEF2F8;margin-bottom:14px;flex-wrap:wrap}
.st{flex:1;min-width:72px}
.st i{font-style:normal;display:block;font-family:JetBrains Mono,monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.st b{font-family:Space Grotesk,sans-serif;font-size:18px;font-weight:700;display:block}
.st small{font-size:10.5px;color:var(--muted)}
.step{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:#F7F9FD;color:var(--muted);cursor:pointer;font-size:13px;padding:0}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--line);background:#F7F9FD;border-radius:999px;padding:7px 14px;font-size:12.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chart{margin-left:28px;height:180px;display:flex;align-items:flex-end;gap:3px;position:relative}
.yax{position:absolute;left:0;width:24px;height:180px;font-family:JetBrains Mono,monospace;font-size:10px;color:var(--muted)}
.yax span{position:absolute;transform:translateY(-50%)}
.mkline{position:absolute;left:0;right:0;border-top:1px dashed #A9B4C6}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.fl{width:100%;border-radius:6px 6px 3px 3px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;color:#fff;font-family:JetBrains Mono,monospace;font-size:10px;font-weight:700;overflow:hidden}
.fl.h{background:var(--hit)}.fl.m{background:var(--miss)}.fl.z{height:3px!important;border-radius:3px;padding:0}
.foot{margin-top:18px;font-size:12px;color:var(--muted)}
.load{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;text-align:center}
.btn{display:inline-block;background:var(--violet);color:#fff;border-radius:999px;padding:12px 24px;font-size:14px;cursor:pointer}
.load input{display:none}
.none{color:var(--muted);font-size:13.5px;padding:14px 2px}
</style></head><body><div class="shell">

  var h=nz(p[0]),c=0;for(var i=0;i<w.length;i++)if(h.indexOf(w[i])>-1)c++;
  if(c>=2&&c>bs){best=o[k];bs=c}}return best}

function curLeg(){
 var f=null;
 for(var i=0;i<D.fixtures.length;i++){if(D.fixtures[i].id===fx)f=D.fixtures[i]}
 if(!f)return null;
 var sq=sqOf(side?f.a:f.h); if(!sq)return null;
 var pl=null; sq.players.forEach(function(p){if(p.id===sel)pl=p});
 if(!pl)return null;
 var bk=oddsFor(f.id,pl.name,mk,line); if(!bk)return null;
 var h=SQ[pl.id], hit=null, n=0;
 if(h&&h.matches.length){n=h.matches.length;
  hit=h.matches.filter(function(m){return (m[mk]||0)>line}).length/n*100}
 return {fid:f.id,match:f.h+" v "+f.a,pid:pl.id,name:pl.name,mk:mk,pt:line,
  price:bk[0],book:bk[1],hit:hit,n:n};
}

function toggleLeg(){
 var l=curLeg(); if(!l)return;
 var i=inCart(pkey(l));
 if(i>-1)CART.splice(i,1); else CART.push(l);
 draw();
}
function dropLeg(i){CART.splice(i,1);
 var ov=document.getElementById("slipov"); if(ov)ov.remove();
 draw(); if(CART.length)showSlip();}

function renderCart(){
 var el=document.getElementById("cartbtn");
 if(!el){el=document.createElement("div");el.id="cartbtn";
  el.onclick=showSlip;document.body.appendChild(el)}
 el.style.display=CART.length?"flex":"none";
 el.textContent=CART.length;
}

function showSlip(){
 if(document.getElementById("slipov"))return;
 var dec=1,prob=1,known=0,fids={};
 CART.forEach(function(l){dec*=l.price;fids[l.fid]=1;
  if(l.hit!==null){prob*=l.hit/100;known++}});
 var imp=100/dec, allKnown=(known===CART.length&&CART.length>0);
 var sameGame=Object.keys(fids).length<CART.length;
 var legs=CART.map(function(l,i){
  var lb=(LBL[l.mk]||["?"])[0];
  return '<div class="leg"><div class="lg"><b>'+l.name+'</b><small>'+lb+' over '+l.pt+
   ' &middot; '+l.match+(l.hit===null?'':' &middot; hit '+Math.round(l.hit)+'% of '+l.n)+
   '</small></div><span class="pz">'+l.price.toFixed(2)+
   '</span><span class="rm" onclick="dropLeg('+i+')">&times;</span></div>'}).join("");
 var gap=allKnown?(prob*100-imp):null;
 var ov=document.createElement("div"); ov.id="slipov";
 ov.onclick=function(e){if(e.target===ov)ov.remove()};
 ov.innerHTML='<div id="slipbox"><h2>Your parlay</h2>'+legs+
  '<div class="tot"><div><b>'+dec.toFixed(2)+'</b><small>combined odds</small></div>'+
  '<div><b>'+imp.toFixed(1)+'%</b><small>price implies</small></div>'+
  '<div><b>'+(allKnown?(prob*100).toFixed(1)+'%':'&mdash;')+'</b><small>history says</small></div></div>'+
  (allKnown?'<div class="warn" style="background:'+(gap>0?'#E2F7F1':'#FBECEA')+';color:'+(gap>0?'#0a7a5f':'#8f2f27')+'">'+
   (gap>0?'History runs <b>'+gap.toFixed(1)+' points ahead</b> of the price.'
        :'The price is <b>'+Math.abs(gap).toFixed(1)+' points shorter</b> than history supports.')+
   ' Remember the price already contains the bookmaker margin.</div>'
   :'<div class="warn">Some legs have no match history, so the combined percentage cannot be calculated.</div>')+
  (sameGame?'<div class="warn">Two or more legs are from the same match. Those outcomes move together, so the real chance is usually a little higher than multiplying them suggests.</div>':'')+
  '<div class="close" onclick="document.getElementById(\'slipov\').remove()">Close</div></div>';
 document.body.appendChild(ov);
}

function afterDraw(){
 renderCart();
 if(view!=="market")return;
 var l=curLeg(); if(!l)return;
 var box=document.querySelector(".odbox"); if(!box)return;
 var on=inCart(pkey(l))>-1;
 var b=document.createElement("div");
 b.className="addbtn"+(on?" on":"");
 b.innerHTML=on?"&#10003; In your parlay &mdash; tap to remove":"+ Add to parlay";
 b.onclick=toggleLeg;
 box.parentNode.insertBefore(b,box.nextSibling);
}

var _draw=draw;
draw=function(){_draw();afterDraw()};
draw();

function snap(){return {view:view,lg:lg,fx:fx,mk:mk,side:side,sel:sel,line:line,scope:scope}}
function hashFor(){
 if(view==="home")return "#";
 if(view==="league")return "#l="+encodeURIComponent(lg);
 if(view==="match")return "#m="+fx;
 return "#m="+fx+"&k="+mk;
}
function fromHash(){
 var h=location.hash.replace(/^#/,"");
 if(!h)return false;
 var q={};
 h.split("&").forEach(function(p){var kv=p.split("=");q[kv[0]]=decodeURIComponent(kv[1]||"")});
 if(q.l){view="league";lg=q.l;return true}
 if(q.m&&q.k){view="market";fx=q.m;mk=q.k;line=(LBL[q.k]||["",0.5])[1];side=0;sel="";scope="all";return true}
 if(q.m){view="match";fx=q.m;return true}
 return false;
}

var _go2=go;
go=function(v,x){_go2(v,x);
 try{history.pushState(snap(),"",hashFor())}catch(e){}};

window.addEventListener("popstate",function(e){
 if(e.state){view=e.state.view;lg=e.state.lg;fx=e.state.fx;mk=e.state.mk;
  side=e.state.side;sel=e.state.sel;line=e.state.line;scope=e.state.scope}
 else if(!fromHash()){view="home"}
 var ov=document.getElementById("slipov"); if(ov)ov.remove();
 draw();
});

if(fromHash())draw();
try{history.replaceState(snap(),"",hashFor())}catch(e){}
</script></body></html>
